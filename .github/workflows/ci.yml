name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Lint
        run: npm run lint

      - name: Unit tests (CI)
        run: npm run test:ci
        env:
          CHROME_BIN: /usr/bin/chromium-browser

      - name: Production build
        run: npm run build:prod

      - name: Upload frontend artifact
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/book-review-blog
          if-no-files-found: error

  manifest:
    name: Manifest (TOML)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.toml
        run: |
          python3 - <<'EOF'
          import sys, tomllib
          with open("manifest.toml", "rb") as f:
              data = tomllib.load(f)
          for key in ["id", "name", "description", "version"]:
              if key not in data:
                  sys.exit(f"Missing required key in manifest.toml: {key}")
          integ = data.get("integration", {})
          for k in ["yunohost", "helpers_version"]:
              if k not in integ:
                  sys.exit(f"Missing integration.{k} in manifest.toml")
          print(f"manifest.toml OK — id={data['id']} version={data['version']}")
          EOF

  api:
    name: API (build)

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Build API
        run: npm run build
