# Redirect /path to /path/ so index.html and SPA routes resolve (sub-path installs only)
#sub_path_only location = __PATH__ {
#sub_path_only     return 301 __PATH__/;
#sub_path_only }

# SPA fallback without rewrite (rewriting breaks SSOWat: $uri becomes /… so SSO targets the wrong path).
# Without try_files+alias (nginx bug): missing file -> 404 -> internal named URI serves index.html.
#sub_path_only location __PATH__/ {
#sub_path_only     alias __INSTALL_DIR__/www/;
#sub_path_only     index index.html;
#sub_path_only     error_page 404 = __PATH__/___ynh_spa_fallback;
#sub_path_only }
#sub_path_only location = __PATH__/___ynh_spa_fallback {
#sub_path_only     internal;
#sub_path_only     default_type text/html;
#sub_path_only     alias __INSTALL_DIR__/www/index.html;
#sub_path_only }

#root_path_only location __PATH__/ {
#root_path_only     alias __INSTALL_DIR__/www/;
#root_path_only     index index.html;
#root_path_only     error_page 404 = __PATH__/___ynh_spa_fallback;
#root_path_only }
#root_path_only location = __PATH__/___ynh_spa_fallback {
#root_path_only     internal;
#root_path_only     default_type text/html;
#root_path_only     alias __INSTALL_DIR__/www/index.html;
#root_path_only }

# Media uploads served by Fastify (uploaded images)
location __PATH__/media/ {
    proxy_pass http://127.0.0.1:__PORT__/blog/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

# API (Fastify) on localhost. Do not use proxy_params_with_auth here: its
# proxy_set_header Ynh-User $http_ynh_user overwrites SSOWat-injected headers with empty
# values. The API reads yunohost.portal from Cookie when headers are absent.
location __PATH__/api/ {
        proxy_pass http://127.0.0.1:__PORT__/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

# Regex alias must map captured path — bare alias + try_files breaks for /path/*.js
location ~* ^__PATH__/(.+\.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot))$ {
    alias __INSTALL_DIR__/www/$1;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

include conf.d/yunohost_panel.conf.inc;
